<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6f3"><title>Little List — To-do</title>
<link rel="stylesheet" href="./css/site.css"></head><body><main class="wrap">
<header class="top"><div class="brand"><div class="mark" aria-hidden="true">✓</div><div><b>Little List</b><small><a class="back-link" href="../index.html">← All projects</a></small></div></div><button class="primary" id="new">＋ Add a task</button></header>
<section class="intro"><div class="eyebrow">Your day, at a glance</div><h1>To-do list</h1><p>Small steps add up. Keep yours all in one place.</p></section>
<section class="stats" aria-label="Task summary"><div class="stat"><span>Open tasks</span><strong id="openCount">0</strong></div><div class="stat"><span>Due today</span><strong id="todayCount">0</strong></div><div class="stat"><span>Completed</span><strong id="doneCount">0</strong></div></section>
<nav class="bar" aria-label="Task filters"><input id="search" class="ctl search" type="search" placeholder="Search tasks…" aria-label="Search tasks"><select class="ctl" id="catFilter" aria-label="Filter category"></select><select class="ctl" id="personFilter" aria-label="Filter assignee"></select><div class="filters" role="group" aria-label="Task status"><button class="active" data-mode="all">All</button><button data-mode="open">To do</button><button data-mode="done">Done</button></div></nav>
<div class="heading"><h2 id="listTitle">All tasks</h2><span id="total"></span></div><section class="list" id="list" aria-live="polite"></section></main>
<dialog id="dialog"><form id="form" class="form"><div class="formhead"><h2 id="formTitle">Add a task</h2><button type="button" class="close" id="close" aria-label="Close">×</button></div><input type="hidden" id="id"><div class="fields"><div class="field"><label for="descInput">What needs doing?</label><input id="descInput" maxlength="180" required placeholder="e.g. Pay the electricity bill"></div><div class="row"><div class="field"><label for="category">Category</label><div class="selectrow"><select id="category"></select><button type="button" class="add" id="addCategory" aria-label="Add category">＋</button></div></div><div class="field"><label for="person">Assignee</label><div class="selectrow"><select id="person"></select><button type="button" class="add" id="addPerson" aria-label="Add person">＋</button></div></div></div><div class="field"><label for="deadline">Deadline <span class="optional">(optional)</span></label><input id="deadline" type="datetime-local"></div><div class="error" id="error" role="alert"></div><div class="formactions"><button type="button" class="cancel" id="cancel">Cancel</button><button class="primary" type="submit">Save task</button></div></div></form></dialog>
<script src="./js/app.js" defer></script></body></html>
